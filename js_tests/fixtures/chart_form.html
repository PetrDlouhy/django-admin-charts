<div id="chart_g1" class="chrt_container">
<div class="chrt_flex">
    <h3>Chart</h3>


    <style>
    .loading {
        pointer-events:none;
    }

    form.loading * {
       opacity: 50%;
    }

    form.loading::after {
         content: "";
         height: 22px;
         width: 22px;
         display: inline-block;
         border: 3px solid var(--hairline-color, #ddd);
         border-top-color: var(--secondary, #417690);
         border-radius: 50%;
         animation: chart-toolbar-spin 0.8s linear infinite;
    }

    @keyframes chart-toolbar-spin {
        to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        form.loading::after { animation-duration: 2s; }
    }

    /* ── flat toolbar: no frame, ghost controls, role icons ───────── */
    .chart-toolbar {
        padding: 3px 0;
    }

    .chart-toolbar-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 2px;
        min-height: 32px;
    }

    .chart-toolbar-filters {
        min-height: 30px;
        padding-top: 1px;
    }

    .chart-toolbar-sep {
        width: 1px;
        height: 18px;
        background: var(--hairline-color, #e9e7e4);
        margin: 0 8px;
        flex: none;
    }

    /* ghost control = role icon + borderless input, one hover surface */
    .chart-ctl {
        display: inline-flex;
        align-items: center;
        height: 26px;
        border: 1px solid transparent;
        border-radius: 4px;
        padding-left: 7px;
        transition: background-color 0.12s, border-color 0.12s;
    }

    .chart-ctl > svg {
        width: 13px;
        height: 13px;
        flex: none;
        color: var(--body-quiet-color, #8f8d8a);
        fill: currentColor;
    }

    .chart-ctl:hover {
        background-color: var(--darkened-bg, #f2f1ef);
        border-color: var(--hairline-color, #e9e7e4);
    }

    .chart-ctl:focus-within {
        border-color: var(--secondary, #417690);
        box-shadow: 0 0 0 2px rgba(65, 118, 144, 0.22);
        background-color: var(--body-bg, #fff);
    }

    .chart-type-icon g { display: none; }

    .chart-toolbar select,
    .chart-toolbar input[type="date"] {
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        font-size: 12.5px;
        color: var(--body-fg, #333);
        background-color: transparent;
        border: none;
        border-radius: 4px;
        height: 24px;
        padding: 0 17px 0 6px;
        max-width: 185px;
        text-overflow: ellipsis;
        cursor: pointer;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="5" viewBox="0 0 8 5"><path d="M0 0l4 5 4-5z" fill="%23908e8a"/></svg>');
        background-repeat: no-repeat;
        background-position: right 5px center;
    }

    .chart-toolbar select:focus,
    .chart-toolbar input[type="date"]:focus {
        outline: none;
    }

    /* the popup list renders with UA colors; on a dark admin that pairs the
       theme's light text with a white list, so pin both to the theme */
    .chart-toolbar select option {
        background-color: var(--body-bg, #fff);
        color: var(--body-fg, #333);
    }

    .chart-toolbar input[type="date"] {
        background-image: none;
        padding: 0 5px;
        width: 112px;
        font-variant-numeric: tabular-nums;
    }

    .chart-ctl-dates { padding-left: 5px; }

    .chart-dates-arrow {
        color: var(--body-quiet-color, #b8b6b2);
        font-size: 12px;
        padding: 0 1px;
    }

    /* ── filters row ──────────────────────────────────────────────── */
    .chart-filters-icon {
        display: inline-flex;
        color: var(--body-quiet-color, #b8b6b2);
        padding: 0 7px 0 4px;
    }

    .chart-filters-icon svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
    }

    .chart-filter-removable {
        position: relative;
        display: inline-flex;
        align-items: center;
        height: 26px;
        background: var(--darkened-bg, #f8f7f6);
        border: 1px solid var(--hairline-color, #e9e7e4);
        border-radius: 13px;
        padding: 0 2px 0 10px;
        gap: 2px;
        margin: 0 2px;
    }

    .chart-filter-removable > label {
        font-size: 10.5px;
        color: var(--body-quiet-color, #8f8d8a);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
    }

    .chart-filter-removable select {
        height: 22px;
        max-width: 160px;
    }

    .chart-filter-removable select:hover {
        background-color: var(--body-bg, #fff);
    }

    .chart-filter-remove-btn {
        font: inherit;
        font-size: 14px;
        line-height: 1;
        color: var(--body-quiet-color, #b8b6b2);
        background: none;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        cursor: pointer;
        padding: 0;
        transition: color 0.12s, background-color 0.12s;
    }

    .chart-filter-remove-btn:hover {
        color: var(--error-fg, #ba2121);
        background: var(--darkened-bg, #f2f1ef);
    }

    .chart-add-filter {
        position: relative;
        display: inline-flex;
        margin: 0 2px;
    }

    .chart-add-filter-btn {
        font: inherit;
        font-size: 12px;
        color: var(--body-quiet-color, #8f8d8a);
        background: none;
        border: 1px solid transparent;
        border-radius: 13px;
        height: 26px;
        padding: 0 10px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.12s, background-color 0.12s, border-color 0.12s;
    }

    .chart-add-filter-btn:hover {
        color: var(--secondary, #417690);
        background: var(--darkened-bg, #f2f1ef);
        border-color: var(--hairline-color, #e9e7e4);
    }

    .chart-add-filter-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: 170px;
        background: var(--body-bg, #fff);
        border: 1px solid var(--hairline-color, #e9e7e4);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        padding: 4px;
        display: none;
        z-index: 40;
    }

    .chart-add-filter-dropdown.show { display: block; }

    .chart-add-filter-option {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 12.5px;
        color: var(--body-fg, #333);
        background: none;
        border: none;
        border-radius: 4px;
        padding: 6px 9px;
        cursor: pointer;
    }

    .chart-add-filter-option:hover,
    .chart-add-filter-option:focus {
        background: var(--darkened-bg, #f2f1ef);
        outline: none;
    }

    /* searchable panel replacing very long filter selects */
    .chart-select-search {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: 200px;
        background: var(--body-bg, #fff);
        border: 1px solid var(--hairline-color, #e9e7e4);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        padding: 4px;
        z-index: 40;
    }

    .chart-select-search input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 12.5px;
        color: var(--body-fg, #333);
        background: var(--darkened-bg, #f8f7f6);
        border: 1px solid var(--hairline-color, #e9e7e4);
        border-radius: 4px;
        padding: 4px 7px;
        margin-bottom: 4px;
    }

    .chart-select-search input:focus {
        outline: none;
        border-color: var(--secondary, #417690);
    }

    .chart-select-search-list {
        max-height: 240px;
        overflow-y: auto;
    }

    .chart-select-search-option {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 12.5px;
        color: var(--body-fg, #333);
        background: none;
        border: none;
        border-radius: 4px;
        padding: 5px 8px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chart-select-search-option:hover,
    .chart-select-search-option:focus,
    .chart-select-search-option.selected {
        background: var(--darkened-bg, #f2f1ef);
        outline: none;
    }

    /* ── actions ──────────────────────────────────────────────────── */
    .chart-toolbar-actions {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-left: auto;
        padding-left: 10px;
    }

    .chart-toolbar-actions button,
    .chart-toolbar-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font: inherit;
        font-size: 11.5px;
        color: var(--body-quiet-color, #8f8d8a);
        background: none;
        border: 1px solid transparent;
        border-radius: 4px;
        height: 26px;
        min-width: 26px;
        padding: 0 5px;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.12s, background-color 0.12s;
    }

    .chart-toolbar-actions button:hover,
    .chart-toolbar-actions a:hover {
        color: var(--secondary, #417690);
        background: var(--darkened-bg, #f2f1ef);
    }

    .chart-toolbar-actions svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        flex: none;
    }

    /* nvd3 hardcodes light colors; re-key text, grid and tooltip to the
       admin theme variables so dark mode stays readable */
    .nvd3 text {
        fill: var(--body-fg, #333);
    }

    .nvd3 .nv-axis line {
        stroke: var(--hairline-color, #e5e5e5);
    }

    .nvd3 .nv-axis path {
        stroke: var(--border-color, #000);
    }

    .nvtooltip {
        background: var(--body-bg, rgba(255, 255, 255, 1));
        color: var(--body-fg, rgba(0, 0, 0, 1));
        border: 1px solid var(--border-color, rgba(0, 0, 0, .2));
    }

    .nvtooltip h3 {
        background-color: var(--darkened-bg, rgba(247, 247, 247, .75));
        color: var(--body-fg, rgba(0, 0, 0, 1));
        border-bottom: 1px solid var(--hairline-color, #ebebeb);
    }

    .nvtooltip table td.legend-color-guide div {
        border: 1px solid var(--border-color, #999);
    }

    @media (max-width: 768px) {
        .chart-filter-removable > label { display: none; }

        .chart-toolbar-actions {
            margin-left: 0;
            width: 100%;
            justify-content: flex-end;
            padding: 2px 0 0;
        }

        .chart-toolbar input[type="date"] { width: 104px; }
    }
</style>
<form class="stateform chart-toolbar" action="." method="POST" enctype="multipart/form-data">
   <input type="hidden" name="csrfmiddlewaretoken" value="TEST-CSRF-TOKEN">

   <div class="chart-toolbar-row">

      <span class="chart-ctl" title="Chart type">
         <svg class="chart-type-icon" viewBox="0 0 16 16" aria-hidden="true">
            <g data-icon="bar"><rect x="1.5" y="8" width="3.4" height="6.5" rx="0.6"/><rect x="6.3" y="4.5" width="3.4" height="10" rx="0.6"/><rect x="11.1" y="1.5" width="3.4" height="13" rx="0.6"/></g>
            <g data-icon="line"><path d="M1 12.6l4.2-5.2 3 3 5.6-7.6 1.2 1L9.5 12l-3-3-3.9 4.8z"/></g>
            <g data-icon="area"><path d="M1 14V9.5L5.5 5l3 3L15 1.5V14z"/></g>
            <g data-icon="pie"><path d="M7.2 1.05A7 7 0 1 0 15 8.8H7.2z"/><path d="M8.8 0.5a7 7 0 0 1 6.7 6.7H8.8z" opacity="0.55"/></g>
         </svg>
         <select name="select_box_chart_type" class="chart-input select_box_chart_type">
  <option value="discreteBarChart" selected>Bar</option>

  <option value="lineChart">Line</option>

  <option value="multiBarChart">Multi Bar</option>

  <option value="pieChart">Pie</option>

  <option value="stackedAreaChart">Stacked Area</option>

  <option value="multiBarHorizontalChart">Multi Bar Horizontal</option>

  <option value="linePlusBarChart">Line Plus Bar</option>

  <option value="scatterChart">Scatter</option>

  <option value="cumulativeLineChart">Cumulative Line</option>

  <option value="lineWithFocusChart">Line With Focus</option>

</select>
      </span>



      <span class="chart-ctl" title="Time scale">
         <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 12.5A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 0 11zM8.7 4.8H7.3V8.6l3 1.8.7-1.2-2.3-1.4z"/></svg>
         <select name="select_box_interval" class="chart-input">
  <option value="hours">Hours</option>

  <option value="days" selected>Days</option>

  <option value="weeks">Weeks</option>

  <option value="months">Months</option>

  <option value="quarters">Quarters</option>

  <option value="years">Years</option>

</select>
      </span>


      <span class="chart-ctl chart-ctl-dates" title="Date range">
         <input type="date" name="time_since" value="2026-07-18" class="chart-input select_box_date_since" required>
         <span class="chart-dates-arrow">→</span>
         <input type="date" name="time_until" value="2026-08-18" class="chart-input select_box_date_until" required>
      </span>









      <span class="chart-toolbar-actions">
         <button class="reload" id="reload" title="reload values from unfinished periods" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.9 3.4A7.2 7.2 0 1 0 15.2 8h-1.9a5.3 5.3 0 1 1-1.1-3.2L10 7h5.5V1.5l-1.6 1.9z"/></svg>
         </button>

         <button class="reload" id="reload_all" title="reload all visible values" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.9 3.4A7.2 7.2 0 1 0 15.2 8h-1.9a5.3 5.3 0 1 1-1.1-3.2L10 7h5.5V1.5l-1.6 1.9z"/></svg>all
         </button>

         <a href='/admin_tools_stats/analytics/?show=g1' target='_blank' title="Open in analytics">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="8" width="3.4" height="6.5" rx="0.6"/><rect x="6.3" y="4.5" width="3.4" height="10" rx="0.6"/><rect x="11.1" y="1.5" width="3.4" height="13" rx="0.6"/></svg>
         </a>
         <a href='#' class="download-csv" data-graph-key="g1" title="Download chart data as CSV">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v8.2L5.2 6.4 4 7.7 8 12l4-4.3-1.2-1.3L8 9.2V1zM2 13h12v2H2z"/></svg>
         </a>
      </span>
   </div>


   <div class="chart-toolbar-row chart-toolbar-filters">
      <span class="chart-filters-icon" title="Filters">
         <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2h14l-5 6.3V14l-4-1.7V8.3z"/></svg>
      </span>


            <div class="chart-filter-removable" data-filter-name="select_box_dynamic_1" data-filter-label="active">
               <label>active</label>
               <select name="select_box_dynamic_1" class="chart-input" required>
  <option value="" selected>-------</option>

  <option value="">All</option>

  <option value="True">True</option>

  <option value="False">False</option>

</select>
               <button type="button" class="chart-filter-remove-btn" data-field="select_box_dynamic_1" title="Remove filter">×</button>
            </div>












      <span class="chart-add-filter">
         <button type="button" class="chart-add-filter-btn" aria-haspopup="true" aria-expanded="false">+ Add filter</button>
         <div class="chart-add-filter-dropdown"></div>
      </span>
   </div>


   <input type="hidden" name="graph_key" value="g1" class="hidden_graph_key">
</form>


    <div id="chart_container_g1" class="chrt_svg_container"><svg></svg></div>

</div>
